<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Vehículo</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Arial', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .phone-container { width: 100%; max-width: 410px; background-color: #121212; min-height: 90vh; display: flex; flex-direction: column; }
        .header { text-align: center; font-size: 14px; font-weight: bold; padding: 15px; color: #888; border-bottom: 1px solid #222; }
        .main-card { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 16px; padding: 20px; margin-top: 20px; }
        .patente { font-size: 32px; font-weight: bold; text-align: center; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
        .modelo { font-size: 12px; color: #888888; text-align: center; font-weight: bold; margin: 5px 0 20px 0; text-transform: uppercase; }
        .row { display: flex; justify-content: space-between; padding: 14px 0; font-size: 15px; }
        .divider { height: 1px; background-color: #2d2d2d; }
        .lbl { color: #888888; }
        .val { font-weight: bold; }
        .alert { color: #ff5555; }
        .sub-card { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 12px; padding: 15px; margin-top: 12px; }
        .sub-title { font-size: 10px; font-weight: bold; color: #888888; margin-bottom: 4px; text-transform: uppercase; }
        .sub-val { font-size: 15px; font-weight: bold; }
        .loading { text-align: center; margin-top: 50px; color: #888; font-size: 16px; }
    </style>
</head>
<body>
    <div class="phone-container" id="app" style="display:none;">
        <div class="header">Lubricentro Motos • Historial Online</div>
        
        <div class="main-card">
            <div class="patente" id="txt-patente">---</div>
            <div class="modelo" id="txt-modelo">CARGANDO...</div>
            <div class="divider"></div>
            <div class="row"><span class="lbl">Propietario/a:</span><span class="val" id="txt-cliente">-</span></div>
            <div class="divider"></div>
            <div class="row"><span class="lbl">Km actual:</span><span class="val" style="font-size: 18px;" id="txt-km">-</span></div>
            <div class="divider"></div>
            <div class="row"><span class="lbl">Estado:</span><span class="val alert">✘ Vencido / Control</span></div>
        </div>

        <div class="sub-card">
            <div class="sub-title">Aceite Usado</div>
            <div class="sub-val" id="txt-aceite">-</div>
        </div>

        <div class="sub-card">
            <div class="sub-title">Filtros y Notas</div>
            <div class="sub-val" style="font-weight: normal; color: #ccc;" id="txt-filtros">-</div>
        </div>
    </div>
    
    <div id="loader" class="loading">Buscando historial de moto...</div>

    <script>
        // Tu URL de Firebase extraída de tu propia captura
        const FIREBASE_URL = "https://firebaseio.com";

        // Leer la patente que viene del código QR (?moto=VALOR)
        const urlParams = new URLSearchParams(window.location.search);
        const motoId = urlParams.get('moto');

        if (motoId) {
            fetch(`${FIREBASE_URL}motos/${motoId.toUpperCase()}.json`)
                .then(response => response.json())
                .then(data => {
                    if(data) {
                        document.getElementById('txt-patente').innerText = motoId.toUpperCase();
                        document.getElementById('txt-modelo').innerText = data.modelo || 'SIN ESPECIFICAR';
                        document.getElementById('txt-cliente').innerText = data.cliente || '-';
                        document.getElementById('txt-km').innerText = data.km || '-';
                        document.getElementById('txt-aceite').innerText = data.aceite || '-';
                        document.getElementById('txt-filtros').innerText = data.filtros || '-';
                        
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('app').style.display = 'block';
                    } else {
                        document.getElementById('loader').innerText = "Moto no registrada o sin historial.";
                    }
                })
                .catch(err => {
                    document.getElementById('loader').innerText = "Error al conectar con el taller.";
                });
        } else {
            document.getElementById('loader').innerText = "Código QR inválido (Falta dominio).";
        }
    </script>
</body>
</html>
